<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">OpenChamber</title>
  <!-- OpenChamber mark, from their favicon.svg, on a tile so it reads on both themes. -->
  <rect width="64" height="64" rx="16" fill="#0F0F0F"/>
  <g transform="translate(32 32) scale(0.96)">
    <path d="M0 0 L-26 -15 L-26 15 L0 30 Z" fill="#F5F5F5" fill-opacity="0.25" stroke="#F5F5F5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 0 L26 -15 L26 15 L0 30 Z" fill="#F5F5F5" fill-opacity="0.4" stroke="#F5F5F5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -30 L-26 -15 L0 0 L26 -15 Z" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linejoin="round"/>
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 -15) scale(0.55)">
      <rect x="-12" y="-14" width="24" height="28" fill="#F5F5F5" fill-opacity="0.4" stroke="#F5F5F5" stroke-width="8"/>
    </g>
  </g>
</svg>